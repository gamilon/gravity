<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gravity</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>Gravity</h1>
    <p>Self-hosted on your Raspberry Pi. Edit <code>public/</code> to build your app.</p>
    <p><a href="/status">Status</a> · <a href="/tokens">API tokens</a> · <span id="user-label">…</span> · <a href="#" id="logout">Log out</a></p>
  </main>
  <script>
    fetch('/api/me', { credentials: 'include' })
      .then((r) => r.json())
      .then((d) => {
        const el = document.getElementById('user-label');
        if (d.user) el.textContent = 'Logged in as ' + d.user.username;
        else el.textContent = '';
      });
    document.getElementById('logout').addEventListener('click', (e) => {
      e.preventDefault();
      fetch('/api/logout', { method: 'POST', credentials: 'include' }).then(() => { window.location.href = '/login'; });
    });
  </script>
</html>
