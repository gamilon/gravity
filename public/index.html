<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gravity</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>Gravity</h1>
    <p>Self-hosted on your Raspberry Pi. Edit <code>public/</code> to build your app.</p>
    <p>
      <a href="/status">Status</a>
      · <a href="/tokens">API tokens</a>
      · <span id="admin-link" style="display:none;">· <a href="/admin">Admin</a></span>
      · <span id="user-label">…</span>
      · <a href="#" id="logout">Log out</a>
    </p>
  </main>
  <script>
    fetch('/api/me', { credentials: 'include' })
      .then((r) => r.json())
      .then((d) => {
        const userLabel = document.getElementById('user-label');
        const adminLink = document.getElementById('admin-link');
        if (d.user) {
          userLabel.textContent = 'Logged in as ' + d.user.username;
          if ((d.user.groups || []).includes('admin')) {
            adminLink.style.display = 'inline';
          }
        } else {
          userLabel.textContent = '';
        }
      });
    document.getElementById('logout').addEventListener('click', (e) => {
      e.preventDefault();
      fetch('/api/logout', { method: 'POST', credentials: 'include' }).then(() => { window.location.href = '/login'; });
    });
  </script>
</html>
