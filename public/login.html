<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Gravity</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .login-form { text-align: left; max-width: 20rem; margin: 0 auto; }
    .login-form label { display: block; margin-top: 0.75rem; color: #aaa; }
    .login-form input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; background: #2d2d44; border: 1px solid #444; color: #eee; border-radius: 4px; }
    .login-form button { margin-top: 1.25rem; padding: 0.5rem 1rem; background: #3b82f6; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    .login-form button:hover { background: #2563eb; }
    .login-form .error { color: #fca5a5; font-size: 0.9rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Log in</h1>
    <form class="login-form" id="login-form" method="post" action="/api/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />
      <div class="error" id="error" aria-live="polite"></div>
      <button type="submit">Log in</button>
    </form>
  </main>
  <script>
    let csrfToken = '';
    fetch('/api/csrf-token', { credentials: 'include' })
      .then((r) => r.json())
      .then((d) => { csrfToken = d.csrfToken || ''; })
      .catch(() => {});

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      err.textContent = '';
      const form = e.target;
      const body = new FormData(form);
      const res = await fetch('/api/login', {
        method: 'POST',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-Token': csrfToken,
        },
        body: JSON.stringify({ username: body.get('username'), password: body.get('password') }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.textContent = data.error || 'Login failed';
        return;
      }
      window.location.href = '/';
    });
  </script>
</body>
</html>
