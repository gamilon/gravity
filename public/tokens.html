<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>API tokens — Gravity</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>API tokens</h1>
    <p><a href="/">← Home</a></p>
    <p>Use these tokens to authenticate API requests. Send them in request headers only: <code>Authorization: Bearer &lt;token&gt;</code> or <code>X-API-Key: &lt;token&gt;</code>. Do not put tokens in URLs.</p>

    <div class="create-form">
      <label for="name">New token name</label>
      <input id="name" type="text" placeholder="e.g. iSpindel device" />
      <button type="button" id="create">Create token</button>
    </div>
    <div id="new-token-box" class="new-token is-hidden"></div>

    <div class="tokens-list">
      <table>
        <thead>
          <tr><th>Name</th><th>Prefix</th><th>Last used</th><th></th></tr>
        </thead>
        <tbody id="tokens-tbody">
          <tr><td colspan="4" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/tokens.js"></script>
</body>
</html>
