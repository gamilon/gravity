<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Gravity</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="admin-main">
    <h1>Admin</h1>
    <p class="nav"><a href="/">← Home</a> · <a href="/tokens">API tokens</a></p>
    <section>
      <h2>Users &amp; groups</h2>
      <p class="muted">Overview of accounts that can log in to Gravity.</p>
      <table>
        <thead>
          <tr><th>ID</th><th>Username</th><th>Groups</th><th></th></tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="4" class="muted">Loading…</td></tr>
        </tbody>
      </table>

      <div id="edit-panel" class="edit-panel" hidden>
        <h3>Edit user: <span id="edit-username"></span></h3>
        <form id="edit-form">
          <label for="edit-groups">Groups (comma-separated)</label>
          <input id="edit-groups" type="text" placeholder="e.g. admin,viewer" />
          <label class="checkbox-row">
            <input type="checkbox" id="edit-disabled" />
            Disabled
          </label>
          <div class="actions">
            <button type="submit">Save</button>
            <button type="button" class="cancel" id="edit-cancel">Cancel</button>
            <span id="edit-error" class="error"></span>
          </div>
        </form>
      </div>

      <form id="user-form" class="mt-1">
        <h3>Create user</h3>
        <label for="user-username">Username</label>
        <input id="user-username" type="text" autocomplete="off" />
        <label for="user-password">Password</label>
        <input id="user-password" type="password" autocomplete="new-password" />
        <label class="checkbox-row"><input type="checkbox" id="user-admin" /> Make admin</label>
        <button type="submit">Create user</button>
        <span id="user-error" class="muted"></span>
      </form>
    </section>

    <section>
      <h2>Groups</h2>
      <p class="muted">Create logical groups (e.g. <code>admin</code>, <code>viewer</code>) to manage permissions.</p>
      <form id="group-form">
        <label for="group-name">New group name</label>
        <input id="group-name" type="text" placeholder="e.g. brewer" />
        <button type="submit">Create group</button>
        <span id="group-error" class="muted"></span>
      </form>
      <ul id="groups-list" class="muted mt-075"></ul>
    </section>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
