<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My account — Gravity</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="account-main">
    <h1>My account</h1>
    <p class="nav"><a href="/">← Home</a></p>

    <section>
      <h2>Profile</h2>
      <dl>
        <dt>Username</dt>
        <dd id="acct-username" class="muted">Loading…</dd>
        <dt>Groups</dt>
        <dd id="acct-groups" class="muted">Loading…</dd>
        <dt>Status</dt>
        <dd id="acct-status" class="muted">Loading…</dd>
      </dl>
    </section>

    <section>
      <h2>Change password</h2>
      <form id="pw-form">
        <label for="pw-current">Current password</label>
        <input id="pw-current" type="password" autocomplete="current-password" />
        <label for="pw-new">New password</label>
        <input id="pw-new" type="password" autocomplete="new-password" />
        <button type="submit">Update password</button>
        <div id="pw-message" class="muted"></div>
      </form>
    </section>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
